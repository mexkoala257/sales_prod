openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Multi-Brand Shopify E-Commerce & B2B Wholesale Portal API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: super-admin
    description: Super Admin platform management
  - name: admin
    description: Store Admin operations
  - name: b2b
    description: B2B wholesale client portal
  - name: storefront
    description: Public B2C storefront

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ─── AUTH ───────────────────────────────────────────────
  /auth/super-admin/login:
    post:
      operationId: loginSuperAdmin
      tags: [auth]
      summary: Super admin login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthToken"
        "401":
          description: Invalid credentials

  /auth/admin/login:
    post:
      operationId: loginAdmin
      tags: [auth]
      summary: Store admin login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthToken"
        "401":
          description: Invalid credentials

  /auth/b2b/login:
    post:
      operationId: loginB2B
      tags: [auth]
      summary: B2B client login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthToken"
        "401":
          description: Invalid credentials

  /auth/b2b/change-password:
    post:
      operationId: changeB2BPassword
      tags: [auth]
      summary: B2B client force password change on first login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordChangeInput"
      responses:
        "200":
          description: Password changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthToken"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current authenticated user info
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthToken"

  # ─── SUPER ADMIN ────────────────────────────────────────
  /super-admin/analytics:
    get:
      operationId: getSuperAdminAnalytics
      tags: [super-admin]
      summary: Platform-wide analytics across all stores
      responses:
        "200":
          description: Platform analytics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformAnalytics"

  /super-admin/stores:
    get:
      operationId: listStores
      tags: [super-admin]
      summary: List all storefronts
      responses:
        "200":
          description: List of stores
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Store"
    post:
      operationId: createStore
      tags: [super-admin]
      summary: Create a new storefront
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoreInput"
      responses:
        "201":
          description: Store created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Store"

  /super-admin/stores/{storeId}:
    get:
      operationId: getStore
      tags: [super-admin]
      summary: Get a store by ID
      parameters:
        - name: storeId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Store"
    patch:
      operationId: updateStore
      tags: [super-admin]
      summary: Update a store
      parameters:
        - name: storeId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoreUpdate"
      responses:
        "200":
          description: Updated store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Store"
    delete:
      operationId: deleteStore
      tags: [super-admin]
      summary: Delete a store
      parameters:
        - name: storeId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /super-admin/stores/{storeId}/admins:
    get:
      operationId: listStoreAdmins
      tags: [super-admin]
      summary: List admins for a store
      parameters:
        - name: storeId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of admins
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminUser"
    post:
      operationId: createStoreAdmin
      tags: [super-admin]
      summary: Create a store admin account
      parameters:
        - name: storeId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUserInput"
      responses:
        "201":
          description: Admin created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"

  /super-admin/stores/{storeId}/admins/{adminId}:
    delete:
      operationId: deleteStoreAdmin
      tags: [super-admin]
      summary: Delete a store admin
      parameters:
        - name: storeId
          in: path
          required: true
          schema:
            type: string
        - name: adminId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /super-admin/orders:
    get:
      operationId: listAllOrders
      tags: [super-admin]
      summary: List all orders across all stores
      responses:
        "200":
          description: All orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"

  /super-admin/orders/{orderId}/status:
    patch:
      operationId: updateOrderStatusSuperAdmin
      tags: [super-admin]
      summary: Advance order fulfillment status
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderStatusUpdate"
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"

  # ─── PLATFORM SETTINGS ──────────────────────────────────
  /super-admin/settings:
    get:
      operationId: getPlatformSettings
      tags: [super-admin]
      summary: Get all platform settings (secret values are masked)
      responses:
        "200":
          description: Platform settings list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlatformSetting"
    put:
      operationId: updatePlatformSettings
      tags: [super-admin]
      summary: Upsert a batch of platform settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlatformSettingsUpdate"
      responses:
        "200":
          description: Updated settings list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlatformSetting"

  /super-admin/settings/test-email:
    post:
      operationId: testSmtpEmail
      tags: [super-admin]
      summary: Send a test email using current SMTP settings
      responses:
        "200":
          description: Test result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestEmailResult"

  /super-admin/shopify/oauth/start:
    get:
      operationId: startShopifyOAuth
      tags: [super-admin]
      summary: Return Shopify OAuth authorization URL (frontend must navigate there)
      responses:
        "200":
          description: Authorization URL to redirect the user to
          content:
            application/json:
              schema:
                type: object
                required: [url]
                properties:
                  url:
                    type: string
                    description: Full Shopify authorization URL including CSRF state
        "400":
          description: Store URL or Client ID not configured

  /super-admin/shopify/oauth/status:
    get:
      operationId: getShopifyOAuthStatus
      tags: [super-admin]
      summary: Returns whether the store is connected via OAuth
      responses:
        "200":
          description: OAuth connection status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopifyOAuthStatus"

  /super-admin/shopify/oauth/disconnect:
    delete:
      operationId: disconnectShopifyOAuth
      tags: [super-admin]
      summary: Clear stored Shopify tokens and disconnect
      responses:
        "200":
          description: Disconnected
          content:
            application/json:
              schema:
                type: object
                required: [disconnected]
                properties:
                  disconnected:
                    type: boolean

  /super-admin/shopify/collections:
    get:
      operationId: listShopifyCollections
      tags: [super-admin]
      summary: List Shopify collections with their store mappings
      responses:
        "200":
          description: Collections list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ShopifyCollectionInfo"
        "502":
          description: Shopify not configured or unreachable

  /super-admin/shopify/mappings:
    put:
      operationId: updateShopifyMappings
      tags: [super-admin]
      summary: Replace collection→store mappings for the submitted collections
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShopifyMappingsUpdate"
      responses:
        "200":
          description: Current mapping rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ShopifyMappingRow"

  /super-admin/shopify/sync:
    post:
      operationId: runShopifySync
      tags: [super-admin]
      summary: Run a full Shopify catalog sync now
      responses:
        "200":
          description: Sync summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopifySyncSummary"

  /super-admin/shopify/status:
    get:
      operationId: getShopifySyncStatus
      tags: [super-admin]
      summary: Last sync status and configured interval
      responses:
        "200":
          description: Sync status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopifySyncStatus"

  /storefront/{storeSlug}/shopify-checkout:
    post:
      operationId: createShopifyCheckout
      tags: [storefront]
      summary: Create a Shopify cart and return the hosted checkout URL
      parameters:
        - name: storeSlug
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShopifyCheckoutRequest"
      responses:
        "200":
          description: Checkout URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopifyCheckoutResponse"
        "400":
          description: Items not synced with Shopify
        "502":
          description: Shopify error

  # ─── STORE ADMIN ────────────────────────────────────────
  /admin/dashboard:
    get:
      operationId: getStoreDashboard
      tags: [admin]
      summary: Store admin dashboard summary
      responses:
        "200":
          description: Dashboard stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreDashboard"

  /admin/products:
    get:
      operationId: listAdminProducts
      tags: [admin]
      summary: List all products for the store
      responses:
        "200":
          description: Products list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
    post:
      operationId: createProduct
      tags: [admin]
      summary: Create a product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "201":
          description: Product created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"

  /admin/products/{productId}:
    get:
      operationId: getAdminProduct
      tags: [admin]
      summary: Get a product
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
    patch:
      operationId: updateProduct
      tags: [admin]
      summary: Update a product
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductUpdate"
      responses:
        "200":
          description: Updated product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
    delete:
      operationId: deleteProduct
      tags: [admin]
      summary: Delete a product
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /admin/products/{productId}/sync-shopify:
    post:
      operationId: syncProductToShopify
      tags: [admin]
      summary: Sync product to Shopify
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Sync result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopifySyncResult"

  /admin/products/import-shopify:
    post:
      operationId: importFromShopify
      tags: [admin]
      summary: Import product catalog from Shopify
      responses:
        "200":
          description: Import result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopifySyncResult"

  /admin/categories:
    get:
      operationId: listAdminCategories
      tags: [admin]
      summary: List all categories
      responses:
        "200":
          description: Categories list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
    post:
      operationId: createCategory
      tags: [admin]
      summary: Create a category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryInput"
      responses:
        "201":
          description: Category created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"

  /admin/categories/{categoryId}:
    patch:
      operationId: updateCategory
      tags: [admin]
      summary: Update a category
      parameters:
        - name: categoryId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryUpdate"
      responses:
        "200":
          description: Updated category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
    delete:
      operationId: deleteCategory
      tags: [admin]
      summary: Delete a category
      parameters:
        - name: categoryId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /admin/b2b-accounts:
    get:
      operationId: listB2BClients
      tags: [admin]
      summary: List all B2B wholesale clients
      responses:
        "200":
          description: B2B clients
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/B2BClient"
    post:
      operationId: createB2BClient
      tags: [admin]
      summary: Provision a new B2B wholesale client
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/B2BClientInput"
      responses:
        "201":
          description: B2B client created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/B2BClient"

  /admin/b2b-accounts/{clientId}:
    get:
      operationId: getB2BClient
      tags: [admin]
      summary: Get a B2B client
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: B2B client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/B2BClient"
    patch:
      operationId: updateB2BClient
      tags: [admin]
      summary: Update a B2B client
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/B2BClientUpdate"
      responses:
        "200":
          description: Updated B2B client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/B2BClient"
    delete:
      operationId: deleteB2BClient
      tags: [admin]
      summary: Delete a B2B client
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /admin/b2b-accounts/{clientId}/products:
    get:
      operationId: getB2BClientProducts
      tags: [admin]
      summary: Get product IDs assigned to a B2B client
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Assigned product IDs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientProductAccess"
    put:
      operationId: setB2BClientProducts
      tags: [admin]
      summary: Set product access for a B2B client
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientProductAccess"
      responses:
        "200":
          description: Updated access
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientProductAccess"

  /admin/orders:
    get:
      operationId: listAdminOrders
      tags: [admin]
      summary: List orders for this store
      responses:
        "200":
          description: Orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"

  /admin/orders/{orderId}:
    get:
      operationId: getAdminOrder
      tags: [admin]
      summary: Get an order with full details
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"

  /admin/orders/{orderId}/status:
    patch:
      operationId: updateOrderStatus
      tags: [admin]
      summary: Advance order fulfillment status (step 1-4)
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderStatusUpdate"
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"

  # ─── B2B PORTAL ─────────────────────────────────────────
  /b2b/profile:
    get:
      operationId: getB2BProfile
      tags: [b2b]
      summary: Get B2B client profile and pricing info
      responses:
        "200":
          description: B2B client profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/B2BProfile"

  /b2b/catalog:
    get:
      operationId: getB2BCatalog
      tags: [b2b]
      summary: Get assigned product catalog with personalized pricing
      responses:
        "200":
          description: Product catalog
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/B2BCatalogProduct"

  /b2b/matrix:
    get:
      operationId: getB2BMatrix
      tags: [b2b]
      summary: Get batch order matrix products with all variants
      responses:
        "200":
          description: Matrix products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/B2BCatalogProduct"

  /b2b/artwork:
    get:
      operationId: listB2BArtwork
      tags: [b2b]
      summary: List uploaded artwork files
      responses:
        "200":
          description: Artwork list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Artwork"

  /b2b/artwork/{artworkId}:
    delete:
      operationId: deleteB2BArtwork
      tags: [b2b]
      summary: Delete an artwork file
      parameters:
        - name: artworkId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /b2b/orders:
    get:
      operationId: listB2BOrders
      tags: [b2b]
      summary: List B2B client orders with status tracking
      responses:
        "200":
          description: Orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
    post:
      operationId: createB2BOrder
      tags: [b2b]
      summary: Create a wholesale order (COD or Net-30)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WholesaleOrderInput"
      responses:
        "201":
          description: Order created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"

  /b2b/orders/{orderId}:
    get:
      operationId: getB2BOrder
      tags: [b2b]
      summary: Get a specific B2B order
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"

  # ─── PUBLIC STOREFRONT ──────────────────────────────────
  /storefront/resolve:
    get:
      operationId: resolveStorefrontByDomain
      tags: [storefront]
      summary: Resolve a storefront by its custom domain
      parameters:
        - name: domain
          in: query
          required: true
          schema:
            type: string
          description: Custom domain to resolve (e.g. apexathletics.com)
      responses:
        "200":
          description: Storefront config for the domain
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorefrontConfig"
        "404":
          description: No active storefront found for this domain

  /storefront/{storeSlug}/config:
    get:
      operationId: getStorefrontConfig
      tags: [storefront]
      summary: Get public store branding and theme config
      parameters:
        - name: storeSlug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Store config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorefrontConfig"

  /storefront/{storeSlug}/products:
    get:
      operationId: listStorefrontProducts
      tags: [storefront]
      summary: List B2C products for the storefront
      parameters:
        - name: storeSlug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"

  /storefront/{storeSlug}/products/{productId}:
    get:
      operationId: getStorefrontProduct
      tags: [storefront]
      summary: Get a storefront product
      parameters:
        - name: storeSlug
          in: path
          required: true
          schema:
            type: string
        - name: productId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"

  /storefront/{storeSlug}/categories:
    get:
      operationId: listStorefrontCategories
      tags: [storefront]
      summary: List categories for a storefront
      parameters:
        - name: storeSlug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"

  /storefront/{storeSlug}/orders:
    post:
      operationId: createB2COrder
      tags: [storefront]
      summary: Create a B2C retail order
      parameters:
        - name: storeSlug
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RetailOrderInput"
      responses:
        "201":
          description: Order created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"

